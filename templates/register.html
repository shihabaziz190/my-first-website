{% extends 'base.html' %}
{% block content %}
<h2>নতুন অ্যাকাউন্ট খুলুন</h2>
<form method="POST" style="max-width: 400px; background: #fff; padding: 20px;">
    <input type="text" name="username" placeholder="ইউজারনেম" required>
    <input type="email" name="email" placeholder="ইমেইল" required>
    <input type="password" name="password" placeholder="পাসওয়ার্ড" required>
    <button type="submit" class="btn">রেজিস্টার</button>
</form>
{% endblock %}
