<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>রেজিস্ট্রেশন</title>
</head>
<body>
    <h2>নতুন অ্যাকাউন্ট তৈরি করুন</h2>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% if messages %}
            {% for category, message in messages %}
                <p style="color: {% if category == 'success' %}green{% else %}red{% endif %};">
                    {{ message }}
                </p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form action="{{ url_for('register') }}" method="POST">
        <label>নাম:</label><br>
        <input type="text" name="name" required><br><br>

        <label>ইমেইল:</label><br>
        <input type="email" name="email" required><br><br>

        <label>পাসওয়ার্ড:</label><br>
        <input type="password" name="password" required><br><br>

        <label>পাসওয়ার্ড আবার লিখুন:</label><br>
        <input type="password" name="confirm_password" required><br><br>

        <button type="submit">রেজিস্ট্রেশন করুন</button>
    </form>

    <p>
        আগে থেকেই অ্যাকাউন্ট আছে?
        <a href="{{ url_for('login') }}">লগইন করুন</a>
    </p>

    <p>
        <a href="{{ url_for('home') }}">হোমে ফিরে যান</a>
    </p>
</body>
</html>
