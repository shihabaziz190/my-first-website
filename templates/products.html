{% extends 'base.html' %}

{% block content %}
<h1>All Products</h1>

<div class="filters">
    <a href="{{ url_for('products') }}">All</a> |
    <a href="{{ url_for('products', category='Accessories') }}">Accessories</a> |
    <a href="{{ url_for('products', category='Electronics') }}">Electronics</a> |
    <a href="{{ url_for('products', category='Bags') }}">Bags</a>
</div>

<div class="product-grid">
    {% for product in products %}
    <div class="product-card">
        <img src="{{ product.image }}" alt="{{ product.name }}">
        <h3>{{ product.name }}</h3>
        <p class="price">${{ "%.2f"|format(product.price) }}</p>
        <a href="{{ url_for('product', product_id=product.id) }}" class="btn-secondary">View Details</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
