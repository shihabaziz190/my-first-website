{% extends 'base.html' %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<div class="card">
    {% if product.image %}
    <img
        src="{{ product.image }}"
        alt="{{ product.name }}"
        style="width: 100%; max-width: 400px; height: 280px; object-fit: cover; border-radius: 10px;"
    >
    {% endif %}

    <h2>{{ product.name }}</h2>

    <p>{{ product.description }}</p>

    <h3>মূল্য: ৳{{ product.price }}</h3>

    {% if product.stock is defined %}
    <p>স্টক: {{ product.stock }}</p>
    {% endif %}

    <form method="post"
          action="{{ url_for('add_to_cart', product_id=product.id) }}">
        <input
            type="number"
            name="quantity"
            value="1"
            min="1"
        >

        <button type="submit" class="btn">
            কার্টে যোগ করুন
        </button>
    </form>
</div>
{% endblock %}
