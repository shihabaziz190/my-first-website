{% extends 'base.html' %}
{% block content %}
<h2>অ্যাডমিন প্যানেল - নতুন পণ্য যোগ করুন</h2>
<form method="POST" style="max-width: 500px; background: #fff; padding: 20px; margin-bottom: 30px;">
    <input type="text" name="name" placeholder="পণ্যের নাম" required>
    <input type="number" step="0.01" name="price" placeholder="দাম" required>
    <input type="text" name="image" placeholder="ইমেজ URL">
    <textarea name="description" placeholder="বিবরণ" required></textarea>
    <button type="submit" class="btn">যোগ করুন</button>
</form>

<h3>বিদ্যমান পণ্যসমূহ</h3>
<table>
    <tr><th>ID</th><th>নাম</th><th>দাম</th></tr>
    {% for product in products %}
    <tr><td>{{ product.id }}</td><td>{{ product.name }}</td><td>৳{{ product.price }}</td></tr>
    {% endfor %}
</table>
{% endblock %}
