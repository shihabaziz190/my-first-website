<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>হোম পেজ</title>
</head>
<body>
    <h1>স্বাগতম আমাদের ওয়েবসাইটে!</h1>
    
    {% if session.user %}
        <p>আপনি লগইন করেছেন: {{ session.user }} (রোল: {{ session.role }})</p>
        {% if session.role == 'admin' %}
            <a href="/admin">অ্যাডমিন ড্যাশবোর্ডে যান</a><br>
        {% endif %}
        <a href="/logout">লগআউট</a>
    {% else %}
        <a href="/login">লগইন করুন</a>
    {% endif %}
</body>
</html>
