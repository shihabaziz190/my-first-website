{% extends 'base.html' %}
{% block content %}
<h2>পপুলার প্রোডাক্টসমূহ</h2>
<div class="grid" style="margin-top: 20px;">
    {% for product in products %}
    <div class="card">
        <img src="{{ product.image }}" alt="{{ product.name }}">
        <h3>{{ product.name }}</h3>
        <p>৳{{ product.price }}</p>
        <a href="{{ url_for('product_detail', id=product.id) }}" class="btn">বিস্তারিত</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
