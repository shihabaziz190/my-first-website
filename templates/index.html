{% extends 'base.html' %}

{% block content %}
<div class="hero">
    <h1>Welcome to hadielectromart</h1>
    <p>Discover our curated collection of premium essentials.</p>
    <a href="{{ url_for('products') }}" class="btn">Shop Now</a>
</div>

<h2>Featured Products</h2>
<div class="product-grid">
    {% for product in products %}
    <div class="product-card">
        <img src="{{ product.image }}" alt="{{ product.name }}">
        <h3>{{ product.name }}</h3>
        <p class="price">${{ "%.2f"|format(product.price) }}</p>
        <a href="{{ url_for('product', product_id=product.id) }}" class="btn-secondary">View Product</a>
    </div>
    {% endfor %}
</div>
{% endblock %}
